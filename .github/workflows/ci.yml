name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # The enclave image runs Python 3.11; test the verifier on the same version.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: npm ci --ignore-scripts
      - name: Scan every contributed file version before running tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            npm run privacy -- --range "$HEAD_SHA"
          else
            test -n "$BASE_SHA" && test -n "$HEAD_SHA"
            npm run privacy -- --range "$BASE_SHA..$HEAD_SHA"
          fi
      - run: npm run transcripts:setup
      - run: npm run check
  trusted-contribution-checks:
    # A fork PR can edit the scripts and config that define its own checks. Re-run the
    # base branch's tooling against the PR's bank files. No secrets, read-only token.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore check tooling from the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout "$BASE_SHA" -- package.json package-lock.json .npmrc vitest.config.ts \
            biome.json tsconfig.json scripts lib banks/adapter-contract.test.ts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Scan fork history with the base branch's privacy rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run privacy -- --range "$BASE_SHA..$HEAD_SHA"
      - run: npm run check:bank
  verify:
    # Keep the existing branch-protection check name. A failed or skipped trusted
    # fork check must not be hidden behind a successful contributor-controlled job.
    needs: [repository-checks, trusted-contribution-checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every applicable check
        env:
          REPOSITORY_RESULT: ${{ needs.repository-checks.result }}
          TRUSTED_RESULT: ${{ needs.trusted-contribution-checks.result }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          test "$REPOSITORY_RESULT" = success
          if [ "$IS_FORK" = true ]; then
            test "$TRUSTED_RESULT" = success
          else
            test "$IS_FORK" = false
            test "$TRUSTED_RESULT" = skipped
          fi
  enclave-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        builder: [one, two]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: bash transcripts/infra/build_measurements.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nitro-build-${{ matrix.builder }}
          path: |
            .local/transcript-nitro-build/build-report.json
            .local/transcript-nitro-build/builder-packages.txt
            .local/transcript-nitro-build/normalized.eif
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
  enclave-compare:
    needs: enclave-build
    # Required check. A job skipped after a failed/cancelled dependency counts as
    # passing for branch protection, so always run and fail closed instead.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both independent builds
        env:
          BUILD_RESULT: ${{ needs.enclave-build.result }}
        run: test "$BUILD_RESULT" = success
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: nitro-build-*
          path: builds
      - name: Compare independent runner measurements
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          paths=sorted(Path('builds').glob('*/build-report.json'))
          reports=[json.loads(p.read_text()) for p in paths]
          assert len(reports)==2, 'two independent reports required'
          for path,report in zip(paths,reports):
              with path.with_name('normalized.eif').open('rb') as image:
                  actual=hashlib.file_digest(image,'sha384').hexdigest()
              assert actual==report['normalizedEifSha384'], 'downloaded EIF digest mismatch'
          for field in ('sourceCommit','baseImage','builderImage','nitroCliVersion','builderPackagesSha256','measurements','normalizedEifSha384'):
              assert reports[0][field]==reports[1][field], 'build mismatch: '+field
          sections=[[s for s in r['eifSections']['sections'] if s['type']!='metadata'] for r in reports]
          assert sections[0]==sections[1], 'non-metadata EIF sections differ'
          print(json.dumps({'independentRunnerMeasurementsMatch':True,
                            'nonMetadataSectionsMatch':True,
                            'normalizedUnsignedEifBytesMatch':True,
                            'downloadedImageDigestsVerified':True,
                            'eifBytesMatch':reports[0]['eifSha384']==reports[1]['eifSha384'],
                            'hardwareAttested':False,'liveVerification':False}))
          PY
